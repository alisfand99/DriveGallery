name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|^> |Could not|FAILED" build.log | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=BUILD_ERRORS::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: DriveGallery-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriveGallery.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DriveGallery.apk --title "DriveGallery (latest)" --notes "Latest debug build" --target ${{ github.sha }}
